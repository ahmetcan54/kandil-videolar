name: Instagram yayını

on:
  # GitHub zamanlanmış görevleri tam saat/buçukta sıkça gecikiyor ya da atlanıyor (25-26.11'de yaşandı):
  # yoğun olmayan dakikalara yayılmış 6 deneme (TR 19:13-21:07). Hangisi önce çalışırsa yayınlar;
  # yayinla.py "bugün zaten yayınlandı" diyerek diğerlerinde çift yayını engeller.
  schedule:
    - cron: "13 16 * * *"
    - cron: "29 16 * * *"
    - cron: "47 16 * * *"
    - cron: "11 17 * * *"
    - cron: "37 17 * * *"
    - cron: "7 18 * * *"
  workflow_dispatch:
    inputs:
      kuru:
        description: "Kuru çalıştır (yayınlama, yalnız sıradakini göster)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Sıradaki Reels'i yayınla
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ID: ${{ secrets.IG_ID }}
          IG_API: ${{ secrets.IG_API }}
          KURU: ${{ github.event_name == 'workflow_dispatch' && inputs.kuru || 'false' }}
        run: python yayinla.py
      - name: Sonucu kuyruğa yaz
        if: always()
        run: |
          git config user.name "kandil-yayin"
          git config user.email "kandil-yayin@users.noreply.github.com"
          git add kuyruk.json
          git diff --cached --quiet || (git commit -m "Yayın sonucu $(date -u +%F)" && git push)
